<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentence Workbench</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Serif+4:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap');
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ---------------------------------------------------------------------------
// DATA
// ---------------------------------------------------------------------------
const TECHNIQUES = [
  { id: "adj", num: 1, cat: "dressup", name: "Quality Adjective",
    remember: "Tells what kind or what a noun is like.",
    formula: "quality adjective + noun",
    bank: ["colorful","tiny","enormous","shiny","brave","gentle","friendly","fluffy","ancient","delicious"],
    examples: ["The colorful bird sang.","The tiny ant carried a leaf.","We crossed the ancient bridge."],
    lookFor: "A specific word that helps the reader picture the noun." },
  { id: "verb", num: 2, cat: "dressup", name: "Strong Verb",
    remember: "Swaps a weak, ordinary verb for a precise action word.",
    formula: "subject + strong verb",
    bank: ["sprinted","dashed","whispered","shouted","pounced","grabbed","soared","rescued","wandered","blasted"],
    examples: ["The lion pounced on its prey.","Emma sprinted to school.","The eagle soared above the mountains."],
    lookFor: "Weak verbs like went, got, said, made, or looked that could be replaced." },
  { id: "lyadv", num: 3, cat: "dressup", name: "-ly Adverb",
    remember: "Tells how an action happens.",
    formula: "verb + -ly adverb",
    bank: ["quickly","carefully","happily","quietly","proudly","slowly","gently","eagerly","softly","bravely"],
    examples: ["She smiled happily.","Dad drove carefully.","The soldier fought bravely."],
    lookFor: "A word ending in -ly that answers \u201cHow did it happen?\u201d" },
  { id: "because", num: 4, cat: "dressup", name: "Because Clause",
    remember: "Explains why something happened.",
    formula: "complete thought + because + reason",
    bank: ["because"],
    examples: ["We stayed inside because it rained.","She smiled because she won.","He wore a jacket because it was cold."],
    lookFor: "A clear reason that answers \u201cWhy?\u201d" },
  { id: "whowhich", num: 5, cat: "dressup", name: "Who/Which Clause",
    remember: "Adds extra info about a noun \u2014 who for people, which for things or animals.",
    formula: "noun, who/which + extra info, + rest of sentence",
    bank: ["who","which"],
    examples: ["Mia, who loves animals, adopted a puppy.","The bicycle, which had a flat tire, leaned against the wall."],
    lookFor: "A person or thing that could use extra description." },
  { id: "asia", num: 6, cat: "dressup", name: "WWW.ASIA Clause",
    remember: "Starts with a subordinating word; can't stand alone.",
    formula: "WWW.ASIA clause, complete thought",
    bank: ["when","while","where","as","since","if","although"],
    examples: ["When the bell rang, the students hurried outside.","Since the trail was muddy, we walked carefully."],
    lookFor: "A dependent clause joined to a complete thought, comma if it comes first." },
  { id: "subject", num: 7, cat: "opener", name: "Subject Opener (S)",
    remember: "Starts directly with the person, place, animal, or thing doing the action.",
    formula: "subject + verb",
    bank: [],
    examples: ["The dog chased the ball.","Our class visited the museum.","Maya opened the mysterious box."],
    lookFor: "The sentence begins with its subject \u2014 don't use this one every time." },
  { id: "prep", num: 8, cat: "opener", name: "Prepositional Opener (P)",
    remember: "Starts with a phrase that tells where, when, or which direction.",
    formula: "prepositional phrase, + complete thought",
    bank: ["after","before","beneath","beside","during","inside","near","over","through","under"],
    examples: ["After lunch, we played outside.","Beneath the bridge, the water rushed past."],
    lookFor: "An opening phrase starting with a preposition, comma after it." },
  { id: "lyopen", num: 9, cat: "opener", name: "-ly Opener (LY)",
    remember: "Starts with an -ly adverb telling how the action happens.",
    formula: "-ly adverb, + complete thought",
    bank: ["carefully","eagerly","gently","nervously","proudly","quickly","quietly","sadly","slowly","suddenly"],
    examples: ["Carefully, Ava carried the glass vase.","Suddenly, thunder shook the house."],
    lookFor: "An -ly word at the start, comma right after it." },
  { id: "ingopen", num: 10, cat: "opener", name: "-ing Opener (ING)",
    remember: "Starts with an -ing action; the doer of that action must come right after the comma.",
    formula: "-ing phrase, + doer + verb",
    bank: ["running","smiling","carrying","looking","climbing","hoping","listening","shivering"],
    examples: ["Running down the path, Liam chased the bus.","Carrying a lantern, the guide entered the cave."],
    lookFor: "The noun right after the comma must be the one doing the -ing action." },
  { id: "clopen", num: 11, cat: "opener", name: "Clausal Opener (CL)",
    remember: "Starts with a dependent clause telling when, why, where, or under what condition.",
    formula: "dependent clause, + complete thought",
    bank: ["when","while","where","as","since","if","although","because"],
    examples: ["Because the road was icy, school opened late.","If the rain stops, we will play outside."],
    lookFor: "A clause that can't stand alone, then a comma, then a complete thought." },
  { id: "vss", num: 12, cat: "opener", name: "Very Short Sentence (VSS)",
    remember: "A complete sentence of 2\u20135 words, used for emphasis.",
    formula: "2\u20135 words + end punctuation",
    bank: [],
    examples: ["Everyone froze.","It was gone.","What a surprise!"],
    lookFor: "A brief, complete thought used sparingly for punch." },
];

const CAT_META = {
  dressup: { label: "Dress-Up", color: "#C98A2B", soft: "#F3E4C6" },
  opener: { label: "Opener", color: "#3B6E8F", soft: "#DCE9F0" },
};

const STORAGE_KEY = "sentence-workbench-progress-v1";

function defaultProgress() {
  const p = {};
  TECHNIQUES.forEach((t) => { p[t.id] = { known: false, practiced: 0, lastResult: null }; });
  return p;
}

// ---------------------------------------------------------------------------
// SENTENCE CHECKER
// ---------------------------------------------------------------------------
function checkSentence(id, raw) {
  const text = raw.trim();
  if (!text) return { mode: "empty", ok: false, msg: "Write a sentence first." };
  const lower = text.toLowerCase();
  const words = text.split(/\s+/).filter(Boolean);
  const firstWord = (words[0] || "").replace(/[^a-zA-Z']/g, "").toLowerCase();
  const endsOk = /[.!?]$/.test(text);

  switch (id) {
    case "because":
      return { mode: "auto", ok: /\bbecause\b/i.test(text) && endsOk,
        msg: /\bbecause\b/i.test(text) ? "Found \u201cbecause\u201d \u2014 nice reason clause!" : "I don't see \u201cbecause\u201d in there yet." };
    case "whowhich":
      return { mode: "auto", ok: /,\s*(who|which)\b/i.test(text) && endsOk,
        msg: /,\s*(who|which)\b/i.test(text) ? "Comma + who/which \u2014 that's the pattern!" : "Try a comma, then who or which, right after the noun." };
    case "asia": {
      const bank = TECHNIQUES.find(t => t.id === "asia").bank;
      const ok = bank.includes(firstWord) && text.includes(",");
      return { mode: "auto", ok, msg: ok ? "Great \u2014 starts with a WWW.ASIA word and has a comma." : "Start with when/while/where/as/since/if/although, then add a comma." };
    }
    case "clopen": {
      const bank = TECHNIQUES.find(t => t.id === "clopen").bank;
      const ok = bank.includes(firstWord) && text.includes(",");
      return { mode: "auto", ok, msg: ok ? "That's a clausal opener!" : "Open with a clause word (when, if, because...) then a comma." };
    }
    case "prep": {
      const bank = TECHNIQUES.find(t => t.id === "prep").bank;
      const ok = bank.includes(firstWord) && text.includes(",");
      return { mode: "auto", ok, msg: ok ? "Prepositional phrase up front \u2014 nailed it." : "Start with a preposition (after, beneath, during...) then a comma." };
    }
    case "lyopen":
      return { mode: "auto", ok: firstWord.endsWith("ly") && text.includes(","),
        msg: (firstWord.endsWith("ly") && text.includes(",")) ? "Starts with an -ly word plus a comma \u2014 perfect." : "First word should end in -ly, followed by a comma." };
    case "ingopen":
      return { mode: "auto", ok: firstWord.endsWith("ing") && text.includes(","),
        msg: (firstWord.endsWith("ing") && text.includes(",")) ? "Nice -ing opener \u2014 just double check the doer comes right after the comma." : "First word should end in -ing, followed by a comma." };
    case "vss":
      return { mode: "auto", ok: words.length >= 2 && words.length <= 5 && endsOk,
        msg: (words.length >= 2 && words.length <= 5 && endsOk) ? "Short and punchy \u2014 that's a VSS." : "Aim for 2\u20135 words with end punctuation." };
    case "lyadv": {
      const bank = TECHNIQUES.find(t => t.id === "lyadv").bank;
      const hasAny = words.some(w => w.replace(/[^a-zA-Z]/g, "").toLowerCase().endsWith("ly"));
      return { mode: "self", ok: null, hint: hasAny ? "I spot an -ly word in there \u2014 you be the judge!" : ("Try working in an -ly word, e.g. " + bank[Math.floor(Math.random()*bank.length)] + ".") };
    }
    case "adj": {
      const bank = TECHNIQUES.find(t => t.id === "adj").bank;
      const hasAny = bank.some(w => lower.includes(w));
      return { mode: "self", ok: null, hint: hasAny ? "Spotted a describing word from the bank \u2014 great choice!" : ("You can use your own adjective, or try one like " + bank[Math.floor(Math.random()*bank.length)] + ".") };
    }
    case "verb": {
      const bank = TECHNIQUES.find(t => t.id === "verb").bank;
      const hasAny = bank.some(w => lower.includes(w));
      return { mode: "self", ok: null, hint: hasAny ? "That's a strong, precise verb!" : ("Any strong verb works \u2014 or try " + bank[Math.floor(Math.random()*bank.length)] + ".") };
    }
    case "subject":
      return { mode: "self", ok: null, hint: "Check: does it start right on the subject, with no opener in front?" };
    default:
      return { mode: "self", ok: null, hint: "Read it back \u2014 does it match the formula above?" };
  }
}

// ---------------------------------------------------------------------------
// UI PRIMITIVES
// ---------------------------------------------------------------------------
function Chip({ children, color, soft }) {
  return (
    <span style={{ background: soft, color, fontFamily: "'JetBrains Mono', monospace" }}
      className="text-[11px] font-bold tracking-wide uppercase px-2 py-1 rounded-full">
      {children}
    </span>
  );
}

function TopBar({ screen, setScreen, streak }) {
  const items = [
    { id: "home", label: "\uD83C\uDFE0 Bench" },
    { id: "flashcards", label: "\uD83D\uDCD6 Flashcards" },
    { id: "practice", label: "\u270D\uFE0F Practice" },
  ];
  return (
    <div className="sticky top-0 z-20 border-b" style={{ background: "#1C2B23", borderColor: "#0F1913" }}>
      <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <span style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-[#F6F1E4] font-bold text-lg tracking-tight">
            \uD83D\uDD27 Sentence Workbench
          </span>
        </div>
        <div className="flex items-center gap-1">
          {streak > 0 && (
            <div className="flex items-center gap-1 mr-2 text-[#E3A83B]">
              <span className="text-sm font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>\uD83D\uDD25 {streak}</span>
            </div>
          )}
          {items.map(({ id, label }) => (
            <button key={id} onClick={() => setScreen(id)}
              className="px-2.5 py-1.5 rounded-lg text-sm transition-colors"
              style={{
                background: screen === id ? "#E3A83B" : "transparent",
                color: screen === id ? "#1C2B23" : "#CFC9B8",
                fontFamily: "'Space Grotesk', sans-serif",
                fontWeight: screen === id ? 700 : 500,
              }}>
              {label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// HOME
// ---------------------------------------------------------------------------
function HomeScreen({ setScreen, progress }) {
  const [idx, setIdx] = useState(0);
  const timerRef = useRef(null);

  useEffect(() => {
    timerRef.current = setInterval(() => setIdx((i) => (i + 1) % TECHNIQUES.length), 3200);
    return () => clearInterval(timerRef.current);
  }, []);

  const t = TECHNIQUES[idx];
  const meta = CAT_META[t.cat];
  const knownCount = Object.values(progress).filter((p) => p.known).length;

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16">
      <div className="mt-8 rounded-2xl overflow-hidden" style={{ background: "#1C2B23" }}>
        <div className="px-6 pt-8 pb-6 text-center">
          <p style={{ fontFamily: "'JetBrains Mono', monospace", color: "#8FA894" }} className="text-xs uppercase tracking-[0.2em] mb-2">
            12 tools on the bench
          </p>
          <h1 style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-[#F6F1E4] text-3xl font-bold mb-1">
            Build stronger sentences
          </h1>
          <p style={{ color: "#B9C2B4" }} className="text-sm">Tap a tool, flip a card, or write your own.</p>
        </div>
        <div className="px-6 pb-8">
          <div className="rounded-xl p-5" style={{ background: "#243B2F" }}>
            <div className="flex items-center justify-between mb-3">
              <Chip color={meta.color} soft={meta.soft}>{meta.label} {t.num}</Chip>
              <div className="flex gap-1">
                {TECHNIQUES.map((_, i) => (
                  <div key={i} className="w-1.5 h-1.5 rounded-full" style={{ background: i === idx ? "#E3A83B" : "#3E5245" }} />
                ))}
              </div>
            </div>
            <p style={{ fontFamily: "'Space Grotesk', sans-serif", color: "#F6F1E4" }} className="font-bold text-lg mb-2">{t.name}</p>
            <p style={{ fontFamily: "'Source Serif 4', serif", color: "#DCE3D8" }} className="text-[15px] italic">
              &ldquo;{t.examples[0]}&rdquo;
            </p>
          </div>
        </div>
      </div>

      <div className="mt-5 rounded-xl border p-4 flex items-center justify-between" style={{ borderColor: "#E6DFC9", background: "#FBF8F0" }}>
        <div>
          <p style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="font-bold text-[#20241D]">{knownCount} / 12 tools mastered</p>
          <p className="text-sm" style={{ color: "#6B6555" }}>Keep flipping and writing to fill the bench.</p>
        </div>
        <div className="w-16 h-16 rounded-full flex items-center justify-center border-4" style={{ borderColor: "#E3A83B" }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace" }} className="font-bold text-[#20241D]">{knownCount}</span>
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-4 mt-5">
        <button onClick={() => setScreen("flashcards")} className="text-left rounded-xl border p-5 hover:shadow-md transition-shadow"
          style={{ borderColor: "#E6DFC9", background: "#FBF8F0" }}>
          <p style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="font-bold text-[#20241D] mt-2">\uD83D\uDCD6 Flashcards</p>
          <p className="text-sm mt-1" style={{ color: "#6B6555" }}>Flip through all 12 tools \u2014 formula, word bank, examples.</p>
        </button>
        <button onClick={() => setScreen("practice")} className="text-left rounded-xl border p-5 hover:shadow-md transition-shadow"
          style={{ borderColor: "#E6DFC9", background: "#FBF8F0" }}>
          <p style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="font-bold text-[#20241D] mt-2">\u270D\uFE0F Practice Writing</p>
          <p className="text-sm mt-1" style={{ color: "#6B6555" }}>Pick a tool and write your own sentence with it.</p>
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// FLASHCARDS
// ---------------------------------------------------------------------------
function Flashcards({ progress, setProgress }) {
  const [filter, setFilter] = useState("all");
  const list = useMemo(() => TECHNIQUES.filter((t) => filter === "all" || t.cat === filter), [filter]);
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);

  useEffect(() => { setPos(0); setFlipped(false); }, [filter]);

  const t = list[pos];
  const meta = CAT_META[t.cat];

  function go(delta) {
    setFlipped(false);
    setPos((p) => (p + delta + list.length) % list.length);
  }

  function markKnown(known) {
    const next = { ...progress, [t.id]: { ...progress[t.id], known } };
    setProgress(next);
    setTimeout(() => go(1), 350);
  }

  return (
    <div className="max-w-2xl mx-auto px-4 pb-16">
      <div className="flex gap-2 mt-6 mb-5 justify-center">
        {["all", "dressup", "opener"].map((f) => (
          <button key={f} onClick={() => setFilter(f)}
            className="px-3 py-1.5 rounded-full text-sm font-bold"
            style={{
              fontFamily: "'Space Grotesk', sans-serif",
              background: filter === f ? "#1C2B23" : "#EFE9D8",
              color: filter === f ? "#F6F1E4" : "#5A5646",
            }}>
            {f === "all" ? "All 12" : CAT_META[f].label + "s"}
          </button>
        ))}
      </div>

      <p className="text-center text-sm mb-3" style={{ color: "#8B856F", fontFamily: "'JetBrains Mono', monospace" }}>
        {pos + 1} of {list.length}
      </p>

      <div onClick={() => setFlipped((f) => !f)} className="cursor-pointer rounded-2xl border-2 min-h-[320px] p-6 flex flex-col justify-between shadow-sm"
        style={{ borderColor: meta.color, background: flipped ? "#FBF8F0" : "#FFFDF7" }}>
        {!flipped ? (
          <div className="flex-1 flex flex-col items-center justify-center text-center gap-4">
            <Chip color={meta.color} soft={meta.soft}>{meta.label} {t.num}</Chip>
            <h2 style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-2xl font-bold text-[#20241D]">{t.name}</h2>
            <p style={{ fontFamily: "'JetBrains Mono', monospace", color: "#6B6555" }} className="text-sm">{t.formula}</p>
            <p className="text-xs mt-4" style={{ color: "#A69F88" }}>Tap card to flip</p>
          </div>
        ) : (
          <div className="flex-1 flex flex-col gap-3">
            <p style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="font-bold text-[#20241D]">{t.name}</p>
            <p style={{ fontFamily: "'Source Serif 4', serif", color: "#3A3626" }} className="text-[15px]">{t.remember}</p>
            {t.bank.length > 0 && (
              <div>
                <p className="text-xs uppercase tracking-wide font-bold mb-1" style={{ color: "#A69F88" }}>Word bank</p>
                <div className="flex flex-wrap gap-1.5">
                  {t.bank.map((w) => (
                    <span key={w} style={{ fontFamily: "'JetBrains Mono', monospace", background: meta.soft, color: meta.color }}
                      className="text-xs px-2 py-0.5 rounded">{w}</span>
                  ))}
                </div>
              </div>
            )}
            <div>
              <p className="text-xs uppercase tracking-wide font-bold mb-1" style={{ color: "#A69F88" }}>Examples</p>
              <ul className="text-sm space-y-1" style={{ fontFamily: "'Source Serif 4', serif", color: "#3A3626" }}>
                {t.examples.map((e, i) => <li key={i}>&ldquo;{e}&rdquo;</li>)}
              </ul>
            </div>
            <p className="text-xs mt-auto pt-2" style={{ color: "#A69F88" }}>Look for: {t.lookFor}</p>
          </div>
        )}
      </div>

      <div className="flex items-center justify-between mt-4">
        <button onClick={() => go(-1)} className="p-2 rounded-full border" style={{ borderColor: "#E6DFC9" }}>\u2039</button>
        {flipped ? (
          <div className="flex gap-2">
            <button onClick={() => markKnown(false)} className="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold"
              style={{ background: "#F3E1DA", color: "#B4502F", fontFamily: "'Space Grotesk', sans-serif" }}>
              \u21BA Review again
            </button>
            <button onClick={() => markKnown(true)} className="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-bold"
              style={{ background: "#DCEEE1", color: "#2F7D46", fontFamily: "'Space Grotesk', sans-serif" }}>
              \u2713 Got it
            </button>
          </div>
        ) : <span className="text-xs" style={{ color: "#C4BEA8" }}>swipe with the arrows</span>}
        <button onClick={() => go(1)} className="p-2 rounded-full border" style={{ borderColor: "#E6DFC9" }}>\u203A</button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// PRACTICE
// ---------------------------------------------------------------------------
function Practice({ progress, setProgress }) {
  const [selectedId, setSelectedId] = useState(TECHNIQUES[0].id);
  const [text, setText] = useState("");
  const [result, setResult] = useState(null);
  const t = TECHNIQUES.find((x) => x.id === selectedId);
  const meta = CAT_META[t.cat];

  function pickRandom() {
    const next = TECHNIQUES[Math.floor(Math.random() * TECHNIQUES.length)];
    setSelectedId(next.id);
    setText("");
    setResult(null);
  }

  function submit() {
    const r = checkSentence(selectedId, text);
    setResult(r);
    const wasGood = r.mode === "auto" ? r.ok : null;
    const prev = progress[selectedId];
    setProgress({
      ...progress,
      [selectedId]: {
        ...prev,
        practiced: (prev.practiced || 0) + 1,
        known: wasGood === true ? true : prev.known,
        lastResult: wasGood,
      },
    });
  }

  return (
    <div className="max-w-2xl mx-auto px-4 pb-16">
      <div className="mt-6 mb-4 flex items-center justify-between">
        <p style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-[#20241D] font-bold text-lg">Pick a tool</p>
        <button onClick={pickRandom} className="flex items-center gap-1.5 text-sm font-bold px-3 py-1.5 rounded-full"
          style={{ background: "#1C2B23", color: "#F6F1E4", fontFamily: "'Space Grotesk', sans-serif" }}>
          \u2728 Surprise me
        </button>
      </div>

      <div className="flex flex-wrap gap-2 mb-5">
        {TECHNIQUES.map((tech) => {
          const m = CAT_META[tech.cat];
          const active = tech.id === selectedId;
          return (
            <button key={tech.id} onClick={() => { setSelectedId(tech.id); setText(""); setResult(null); }}
              className="px-2.5 py-1 rounded-full text-xs font-bold border"
              style={{
                fontFamily: "'JetBrains Mono', monospace",
                borderColor: active ? m.color : "#E6DFC9",
                background: active ? m.soft : "transparent",
                color: active ? m.color : "#8B856F",
              }}>
              {tech.num}. {tech.name.split(" (")[0]}
            </button>
          );
        })}
      </div>

      <div className="rounded-2xl border p-5" style={{ borderColor: "#E6DFC9", background: "#FBF8F0" }}>
        <Chip color={meta.color} soft={meta.soft}>{meta.label} {t.num}</Chip>
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif" }} className="text-xl font-bold text-[#20241D] mt-2">{t.name}</h2>
        <p style={{ fontFamily: "'JetBrains Mono', monospace", color: "#6B6555" }} className="text-sm mt-1 mb-3">{t.formula}</p>
        <p style={{ fontFamily: "'Source Serif 4', serif", color: "#3A3626" }} className="text-sm mb-3">{t.remember}</p>
        {t.bank.length > 0 && (
          <div className="flex flex-wrap gap-1.5 mb-4">
            {t.bank.map((w) => (
              <span key={w} style={{ fontFamily: "'JetBrains Mono', monospace", background: meta.soft, color: meta.color }}
                className="text-xs px-2 py-0.5 rounded">{w}</span>
            ))}
          </div>
        )}

        <textarea value={text} onChange={(e) => { setText(e.target.value); setResult(null); }}
          placeholder="Write your sentence here..." rows={3}
          className="w-full rounded-lg border p-3 text-[15px] outline-none focus:ring-2"
          style={{ borderColor: "#E6DFC9", fontFamily: "'Source Serif 4', serif", color: "#20241D" }} />

        <button onClick={submit} disabled={!text.trim()} className="mt-3 w-full py-2.5 rounded-lg font-bold text-sm"
          style={{
            fontFamily: "'Space Grotesk', sans-serif",
            background: text.trim() ? "#E3A83B" : "#EFE9D8",
            color: text.trim() ? "#1C2B23" : "#B9B29A",
          }}>
          Check my sentence
        </button>

        {result && (
          <div className="mt-4 rounded-lg p-3 flex items-start gap-2"
            style={{ background: result.mode === "auto" ? (result.ok ? "#DCEEE1" : "#F3E1DA") : "#E3ECF2" }}>
            <p className="text-sm" style={{ color: "#3A3626", fontFamily: "'Source Serif 4', serif" }}>
              {result.mode === "auto" ? (result.ok ? "\u2713 " : "\u2717 ") : "\u2728 "}
              {result.mode === "auto" ? result.msg : result.hint}
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// APP
// ---------------------------------------------------------------------------
function App() {
  const [screen, setScreen] = useState("home");
  const [progress, setProgressState] = useState(defaultProgress());
  const [streak, setStreak] = useState(0);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setProgressState({ ...defaultProgress(), ...parsed.progress });
        setStreak(parsed.streak || 0);
      }
    } catch (e) {}
  }, []);

  function setProgress(next) {
    setProgressState(next);
    const knownCount = Object.values(next).filter((p) => p.known).length;
    const newStreak = Math.max(streak, knownCount);
    setStreak(newStreak);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ progress: next, streak: newStreak }));
    } catch (e) {}
  }

  return (
    <div className="min-h-screen" style={{ background: "#F6F1E4" }}>
      <TopBar screen={screen} setScreen={setScreen} streak={streak} />
      {screen === "home" && <HomeScreen setScreen={setScreen} progress={progress} />}
      {screen === "flashcards" && <Flashcards progress={progress} setProgress={setProgress} />}
      {screen === "practice" && <Practice progress={progress} setProgress={setProgress} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
